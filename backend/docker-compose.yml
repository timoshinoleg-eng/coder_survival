# Local development compose — PostgreSQL + backend app with hot-reload.
# Not used in production; production uses docker-compose.backend.yml on the VM.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: coder_survival
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: coder_survival
      DB_USER: postgres
      DB_PASSWORD: postgres
      BOT_TOKEN: ${BOT_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: npm start

volumes:
  postgres_data:
