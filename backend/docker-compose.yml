version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codersurvival
      POSTGRES_USER: codersurvival
      POSTGRES_PASSWORD: CSdb2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codersurvival"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: codersurvival
      DB_USER: codersurvival
      DB_PASSWORD: CSdb2026!
      BOT_TOKEN: ${BOT_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: npm run dev

volumes:
  postgres_data: