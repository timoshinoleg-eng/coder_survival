name: Render Deploy Status & Setup

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'check-status'
        type: choice
        options:
          - check-status
          - run-migrations
          - full-setup

jobs:
  render-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Render Deploy Status
        id: deploy-status
        run: |
          echo "Checking Render service status..."
          # Render public health endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://coder-survival.onrender.com/health || echo "000")
          echo "Health check status: $STATUS"
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Service is healthy"
            echo "status=healthy" >> $GITHUB_OUTPUT
          elif [ "$STATUS" = "404" ]; then
            echo "⚠️ Service returned 404 - may need migrations or is still deploying"
            echo "status=needs-setup" >> $GITHUB_OUTPUT
          elif [ "$STATUS" = "000" ]; then
            echo "❌ Service unreachable - may be sleeping or deploying"
            echo "status=unreachable" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Service returned $STATUS"
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Display Setup Instructions
        if: steps.deploy-status.outputs.status != 'healthy'
        run: |
          echo "========================================="
          echo "RENDER SETUP REQUIRED"
          echo "========================================="
          echo ""
          echo "1. Go to: https://dashboard.render.com"
          echo "2. Find service: coder-survival"
          echo "3. Add these Environment Variables:"
          echo ""
          echo "   BOT_TOKEN=<your-telegram-bot-token>"
          echo "   BOT_BACKEND_SECRET=<random-secret-string>"
          echo ""
          echo "4. Click 'Manual Deploy' -> 'Clear build cache & deploy'"
          echo "5. Wait for deploy to finish"
          echo ""
          echo "6. Run migrations via Render Shell:"
          echo "   cd backend && npm run migrate"
          echo ""
          echo "Or run this workflow with 'full-setup' after adding secrets"

      - name: Run Migrations (if secrets configured)
        if: github.event.inputs.action == 'run-migrations' || github.event.inputs.action == 'full-setup'
        run: |
          echo "To run migrations on Render:"
          echo "1. Go to https://dashboard.render.com"
          echo "2. Find coder-survival service"
          echo "3. Click 'Shell' tab"
          echo "4. Run: cd backend && npm run migrate"
          echo ""
          echo "Or use Render API with RENDER_API_KEY secret"

      - name: Notify Completion
        run: |
          echo "========================================="
          echo "Render Status Check Complete"
          echo "Service URL: https://coder-survival.onrender.com"
          echo "Health: https://coder-survival.onrender.com/health"
          echo "========================================="
