name: Cloud.ru Infra Check

on:
  push:
    branches:
      - infra/cloudru-production
      - infra/cloudru-first-deploy-hardening
      - infra/cloudru-terraform
      - infra/cloudru-ephemeral-ci-ssh
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - 'deploy/cloudru/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/cloudru-infra-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - 'deploy/cloudru/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/cloudru-infra-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n deploy/cloudru/bootstrap-vm.sh
          bash -n deploy/cloudru/configure-nginx.sh
          bash -n deploy/cloudru/install-terraform-provider-linux-amd64.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install pinned Cloud.ru Evolution provider
        run: bash deploy/cloudru/install-terraform-provider-linux-amd64.sh

      - name: Validate Cloud.ru production Terraform
        working-directory: deploy/cloudru/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate ephemeral CI SSH Terraform
        working-directory: deploy/cloudru/terraform/ci-ssh-access
        shell: bash
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate

      - name: Build backend image
        run: docker build -t coder-survival-backend:ci ./backend

      - name: Validate raw env round-trip and compose
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f backend.env' EXIT
          cat > backend.env <<'ENV'
          BOT_TOKEN=test-token
          BOT_BACKEND_SECRET=literal-$TOKEN#value with spaces
          ADMIN_API_SECRET=test-admin-secret
          DB_HOST=10.0.0.10
          DB_PORT=5432
          DB_NAME=coder_survival
          DB_USER=coder_survival
          DB_PASSWORD=pa$$word#with spaces
          DB_SSL=false
          WEBAPP_URL=https://frontend.example.com
          FRONTEND_URL=https://frontend.example.com
          CORS_ALLOWED_ORIGINS=
          REWARDED_AD_PROVIDER=
          ADSGRAM_SECRET=
          PROPELLER_SECRET=
          ALERT_CHAT_ID=
          INIT_DATA_MAX_AGE_SECONDS=3600
          NODE_ENV=production
          PORT=3000
          PAYMENTS_ENABLED=false
          ENV
          chmod 600 backend.env

          BACKEND_IMAGE_TAG=ci docker compose -f docker-compose.backend.yml config >/dev/null

          BACKEND_IMAGE_TAG=ci docker compose -f docker-compose.backend.yml run --rm --no-deps backend \
            node -e 'if (process.env.DB_PASSWORD !== "pa$$word#with spaces" || process.env.BOT_BACKEND_SECRET !== "literal-$TOKEN#value with spaces") process.exit(1)'

          docker run --rm --env-file backend.env coder-survival-backend:ci \
            node -e 'if (process.env.DB_PASSWORD !== "pa$$word#with spaces" || process.env.BOT_BACKEND_SECRET !== "literal-$TOKEN#value with spaces") process.exit(1)'

          docker run --rm --env-file backend.env coder-survival-backend:ci \
            node --input-type=module -e 'import { assertProductionConfig } from "./src/config/productionPreflight.js"; assertProductionConfig(process.env)'
