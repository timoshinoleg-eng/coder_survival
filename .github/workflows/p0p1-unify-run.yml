name: P0 P1 unification runner

on:
  push:
    branches:
      - fix/p0-p1-audit-requirements
    paths:
      - '.github/workflows/p0p1-unify-run.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coder_survival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coder_survival_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/coder_survival_test
      NODE_ENV: test
      BOT_TOKEN: 123456789:test_token_for_ci_only
      BOT_BACKEND_SECRET: p0p1-ci-secret
      SESSION_SECRET: p0p1-ci-session
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-audit-requirements
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply fail-closed transform
        run: python3 .github/scripts/p0p1_unify.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run targeted backend tests
        working-directory: backend
        run: >-
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js --runInBand
          tests/p0p1AuditRequirements.test.js
          tests/progression.passiveDecay.test.js
          tests/stage2.oracles.test.js
          tests/payments.firstPurchaseBonus.test.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests and build
        working-directory: frontend
        run: |
          npm test
          npm run build

      - name: Commit verified changes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/config/balance.js backend/src/utils/progression.js backend/src/utils/pass.js backend/src/routes/quests.js backend/src/routes/streak.js backend/src/routes/buy.js backend/tests/stage2.oracles.test.js backend/tests/p0p1AuditRequirements.test.js
          git commit -m 'fix(pass): unify P0/P1 progression on production DB curve'
          git push origin HEAD:fix/p0-p1-audit-requirements
