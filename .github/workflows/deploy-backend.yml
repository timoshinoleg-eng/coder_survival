name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: coder_survival_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coder_survival_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coder_survival_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backend tests
        run: |
          npm ci
          node src/migrate.js
          node src/migrate.js
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy code to VM
        run: |
          rsync -avz --exclude='node_modules' --exclude='.git' \
            ./backend/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/coder-survival-backend/

      - name: Backup database before schema change
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            BACKUP_DIR=/opt/coder-survival-backups
            mkdir -p "$BACKUP_DIR"
            STAMP=$(date +%Y%m%d-%H%M%S)
            # host.docker.internal covers the VM-host database; the same flag is
            # used by docker-compose.backend.yml for the running service.
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              -e PGPASSWORD="${{ secrets.DB_PASSWORD }}" \
              postgres:15 \
              pg_dump -h "${{ secrets.DB_HOST }}" -p "${{ secrets.DB_PORT }}" \
                      -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -Fc \
              > "$BACKUP_DIR/predeploy-$STAMP.dump"
            ls -la "$BACKUP_DIR/predeploy-$STAMP.dump"
          '

      - name: Build image on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            cd /tmp/coder-survival-backend
            docker build -t coder-survival-backend:local .
          '

      - name: Run database migrations
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            # Migrations run against the PRODUCTION database, from inside the new
            # image, BEFORE the container swap. If a migration fails the job dies
            # here and the currently running container is left untouched.
            #
            # Before this step existed, migrations only ever ran in the `test`
            # job against an ephemeral CI Postgres, so 059/060/061 were never
            # applied to production.
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              -e NODE_ENV=production \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_SSL="${{ secrets.DB_SSL }}" \
              -e DB_SSL_REJECT_UNAUTHORIZED="${{ secrets.DB_SSL_REJECT_UNAUTHORIZED }}" \
              coder-survival-backend:local \
              node src/migrate.js
          '

      - name: Swap container
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e

            # Stop old container
            docker stop coder-survival-backend 2>/dev/null || true
            docker rm coder-survival-backend 2>/dev/null || true

            # Run new container with secrets from GitHub
            docker run -d \
              --name coder-survival-backend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_SSL="${{ secrets.DB_SSL }}" \
              -e DB_SSL_REJECT_UNAUTHORIZED="${{ secrets.DB_SSL_REJECT_UNAUTHORIZED }}" \
              -e BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
              -e WEBAPP_URL="${{ secrets.WEBAPP_URL }}" \
              -e BOT_BACKEND_SECRET="${{ secrets.BOT_BACKEND_SECRET }}" \
              coder-survival-backend:local
          '

      - name: Health check with retry (up to 30s)
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            for i in 1 2 3; do
              sleep 10
              curl -f http://localhost:3000/health && break
              if [ $i -eq 3 ]; then exit 1; fi
            done
          '

      - name: Cleanup
        if: always()
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            docker image prune -f
            rm -rf /tmp/coder-survival-backend
          '

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'docker ps --filter name=coder-survival-backend'
