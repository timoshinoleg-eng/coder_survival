name: Deploy Backend to Cloud.ru

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to release this commit to Cloud.ru production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudru-production-backend
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: coder-survival-backend

jobs:
  request:
    runs-on: ubuntu-latest
    env:
      DEPLOY_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Guard production release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_CONFIRM" == "deploy" ]] || { echo "Confirmation must be exactly: deploy" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Production releases are allowed only from main; got $GITHUB_REF" >&2; exit 1; }

  test:
    needs: request
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coder_survival_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coder_survival_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coder_survival_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend migration and test gate
        run: |
          npm ci
          node src/migrate.js
          node src/migrate.js
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable backend image
        run: |
          docker build --pull -t "$IMAGE_REPOSITORY:$GITHUB_SHA" ./backend
          docker save "$IMAGE_REPOSITORY:$GITHUB_SHA" | gzip -1 > backend-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: backend-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production-cloudru
    env:
      SSH_HOST: ${{ secrets.CLOUDRU_VM_HOST }}
      SSH_USER: ${{ secrets.CLOUDRU_VM_USER }}
      SSH_PORT: ${{ vars.CLOUDRU_VM_SSH_PORT || '22' }}
      CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
      CLOUDRU_AUTH_KEY_ID: ${{ secrets.CLOUDRU_AUTH_KEY_ID }}
      CLOUDRU_AUTH_SECRET: ${{ secrets.CLOUDRU_AUTH_SECRET }}
      CLOUDRU_SECURITY_GROUP_NAME: ${{ vars.CLOUDRU_SECURITY_GROUP_NAME || 'coder-survival-backend' }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_BACKEND_SECRET: ${{ secrets.BOT_BACKEND_SECRET }}
      ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSL: ${{ vars.CLOUDRU_DB_SSL || 'false' }}
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      REWARDED_AD_PROVIDER: ${{ secrets.REWARDED_AD_PROVIDER }}
      ADSGRAM_SECRET: ${{ secrets.ADSGRAM_SECRET }}
      PROPELLER_SECRET: ${{ secrets.PROPELLER_SECRET }}
      ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
      BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}

      - name: Validate production deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(SSH_HOST SSH_USER CLOUDRU_PROJECT_ID CLOUDRU_AUTH_KEY_ID CLOUDRU_AUTH_SECRET BOT_TOKEN BOT_BACKEND_SECRET ADMIN_API_SECRET DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD WEBAPP_URL FRONTEND_URL BACKEND_HEALTH_URL)
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required Cloud.ru deployment value: $key" >&2
              exit 1
            fi
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || {
            echo "CLOUDRU_VM_SSH_PORT must be an integer between 1 and 65535" >&2
            exit 1
          }
          case "$BACKEND_HEALTH_URL" in
            https://*/health) ;;
            *) echo "BACKEND_HEALTH_URL must be an HTTPS /health endpoint" >&2; exit 1 ;;
          esac
          NODE_ENV=production PAYMENTS_ENABLED=false node --input-type=module <<'NODE'
          import { inspectProductionConfig } from './backend/src/config/productionPreflight.js';
          const findings = inspectProductionConfig(process.env);
          if (findings.errors.length) {
            console.error(`Production config preflight failed: ${findings.errors.join(', ')}`);
            process.exit(1);
          }
          const webapp = new URL(process.env.WEBAPP_URL);
          const frontend = new URL(process.env.FRONTEND_URL);
          if (frontend.origin !== process.env.FRONTEND_URL || webapp.origin !== frontend.origin) {
            console.error('WEBAPP_URL must use the canonical FRONTEND_URL origin');
            process.exit(1);
          }
          NODE

      - name: Build raw backend env file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > backend.env
          import os, sys
          keys = [
              'BOT_TOKEN', 'BOT_BACKEND_SECRET', 'ADMIN_API_SECRET',
              'DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD', 'DB_SSL',
              'WEBAPP_URL', 'FRONTEND_URL', 'CORS_ALLOWED_ORIGINS',
              'REWARDED_AD_PROVIDER', 'ADSGRAM_SECRET', 'PROPELLER_SECRET',
              'ALERT_CHAT_ID', 'INIT_DATA_MAX_AGE_SECONDS',
          ]
          defaults = {'INIT_DATA_MAX_AGE_SECONDS': '3600'}
          for key in keys:
              value = os.environ.get(key, defaults.get(key, ''))
              if any(ch in value for ch in ('\n', '\r', '\x00')):
                  print(f'{key} contains a forbidden newline or NUL', file=sys.stderr)
                  raise SystemExit(1)
              print(f'{key}={value}')
          print('NODE_ENV=production')
          print('PORT=3000')
          print('PAYMENTS_ENABLED=false')
          PY
          chmod 600 backend.env

      - name: Setup Terraform for temporary SSH access
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install pinned Cloud.ru Evolution provider
        run: bash deploy/cloudru/install-terraform-provider-linux-amd64.sh

      - name: Open ephemeral GitHub runner SSH access
        id: ci_ssh
        working-directory: deploy/cloudru/terraform/ci-ssh-access
        shell: bash
        env:
          TF_VAR_project_id: ${{ secrets.CLOUDRU_PROJECT_ID }}
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_AUTH_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_AUTH_SECRET }}
          TF_VAR_security_group_name: ${{ vars.CLOUDRU_SECURITY_GROUP_NAME || 'coder-survival-backend' }}
          TF_VAR_ssh_port: ${{ vars.CLOUDRU_VM_SSH_PORT || '22' }}
          TF_VAR_github_run_id: ${{ github.run_id }}
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --ipv4 https://checkip.amazonaws.com | tr -d '[:space:]')"
          python3 - "$runner_ip" <<'PY'
          import ipaddress, sys
          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit('Expected one concrete public IPv4 for the GitHub runner')
          PY
          runner_cidr="${runner_ip}/32"
          echo "source_cidr=$runner_cidr" >> "$GITHUB_OUTPUT"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          export TF_VAR_source_cidr="$runner_cidr"
          terraform init -backend=false -input=false
          terraform apply -auto-approve -input=false -no-color
          echo "Temporary SSH access opened for GitHub Actions run $GITHUB_RUN_ID from $runner_cidr"

      - name: Configure SSH host identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLOUDRU_VM_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.CLOUDRU_VM_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Missing CLOUDRU_VM_SSH_KEY" >&2; exit 1; }
          [[ -n "$SSH_HOST_KEY" ]] || { echo "Missing CLOUDRU_VM_HOST_KEY" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          known_host="$SSH_HOST"
          if [[ "$SSH_PORT" != "22" ]]; then known_host="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
            echo "CLOUDRU_VM_HOST_KEY does not contain the configured SSH host/port" >&2
            exit 1
          }

      - name: Verify DNS points health endpoint to deployment VM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket, sys
          from urllib.parse import urlparse
          health_host = urlparse(os.environ['BACKEND_HEALTH_URL']).hostname
          ssh_host = os.environ['SSH_HOST']
          def addresses(host):
              try:
                  return {row[4][0] for row in socket.getaddrinfo(host, None, socket.AF_INET)}
              except socket.gaierror as exc:
                  print(f'Cannot resolve {host}: {exc}', file=sys.stderr)
                  raise SystemExit(1)
          health_ips = addresses(health_host)
          ssh_ips = addresses(ssh_host)
          if health_ips.isdisjoint(ssh_ips):
              print('BACKEND_HEALTH_URL DNS does not resolve to the configured Cloud.ru VM', file=sys.stderr)
              print(f'health IPv4={sorted(health_ips)} vm IPv4={sorted(ssh_ips)}', file=sys.stderr)
              raise SystemExit(1)
          print(f'DNS target verified: {health_host} -> {sorted(health_ips)}')
          PY

      - name: Verify Cloud.ru VM prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null
          docker info >/dev/null
          compose_version="$(docker compose version --short | sed 's/^v//')"
          minimum="2.30.0"
          if [[ "$(printf '%s\n%s\n' "$minimum" "$compose_version" | sort -V | head -n1)" != "$minimum" ]]; then
            echo "Docker Compose >= $minimum is required; found $compose_version" >&2
            exit 1
          fi
          command -v nginx >/dev/null
          echo "VM prerequisites passed (Docker Compose $compose_version)"
          REMOTE

      - name: Transfer immutable release payload
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST")
          SCP=(scp -P "$SSH_PORT")
          "${SSH[@]}" 'mkdir -p "$HOME/coder-survival/backups" && chmod 700 "$HOME/coder-survival" "$HOME/coder-survival/backups"'
          "${SCP[@]}" backend-image.tar.gz docker-compose.backend.yml backend.env "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Backup, migrate, deploy and rollback on failed health
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "NEW_TAG='$GITHUB_SHA' NEW_IMAGE='$IMAGE_REPOSITORY:$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="$HOME/coder-survival"
          BACKUP_DIR="$APP_DIR/backups"
          mkdir -p "$BACKUP_DIR"

          mv /tmp/docker-compose.backend.yml "$APP_DIR/docker-compose.backend.yml"
          mv /tmp/backend.env "$APP_DIR/backend.env"
          chmod 600 "$APP_DIR/backend.env"

          gzip -dc /tmp/backend-image.tar.gz | docker load >/dev/null
          rm -f /tmp/backend-image.tar.gz

          OLD_IMAGE="$(docker inspect -f '{{.Config.Image}}' coder-survival-backend 2>/dev/null || true)"
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          BACKUP_FILE="$BACKUP_DIR/predeploy-$STAMP.dump"

          docker run --rm --env-file "$APP_DIR/backend.env" "$NEW_IMAGE" node --input-type=module -e '
            import { assertProductionConfig } from "./src/config/productionPreflight.js";
            assertProductionConfig(process.env);
          '

          docker run --rm --env-file "$APP_DIR/backend.env" postgres:16-alpine sh -euc '
            export PGPASSWORD="$DB_PASSWORD"
            if [ "${DB_SSL:-false}" = "false" ]; then export PGSSLMODE=disable; else export PGSSLMODE=require; fi
            pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"
          '

          docker run --rm --env-file "$APP_DIR/backend.env" postgres:16-alpine sh -euc '
            export PGPASSWORD="$DB_PASSWORD"
            if [ "${DB_SSL:-false}" = "false" ]; then export PGSSLMODE=disable; else export PGSSLMODE=require; fi
            exec pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -Fc
          ' > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"

          docker run --rm --env-file "$APP_DIR/backend.env" "$NEW_IMAGE" node src/migrate.js

          if ! BACKEND_IMAGE_TAG="$NEW_TAG" \
            docker compose -f "$APP_DIR/docker-compose.backend.yml" up -d --no-build --remove-orphans; then
            echo "Container swap failed before health check" >&2
            exit 1
          fi

          healthy=false
          for _ in $(seq 1 12); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' coder-survival-backend 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            docker logs --tail=150 coder-survival-backend || true
            if [[ "$OLD_IMAGE" == coder-survival-backend:* ]] && docker image inspect "$OLD_IMAGE" >/dev/null 2>&1; then
              OLD_TAG="${OLD_IMAGE#coder-survival-backend:}"
              echo "Health failed; rolling back to $OLD_IMAGE" >&2
              BACKEND_IMAGE_TAG="$OLD_TAG" \
                docker compose -f "$APP_DIR/docker-compose.backend.yml" up -d --no-build --remove-orphans || true
            fi
            exit 1
          fi

          printf '%s\n' "$NEW_IMAGE" > "$APP_DIR/deployed-image.txt"
          find "$BACKUP_DIR" -type f -name 'predeploy-*.dump' -mtime +14 -delete
          docker image prune -f >/dev/null
          REMOTE

      - name: Verify public HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 "$BACKEND_HEALTH_URL")"
          HEALTH_BODY="$body" node --input-type=module -e '
            const health = JSON.parse(process.env.HEALTH_BODY);
            if (health.status !== "ok" || health.db !== "connected") process.exit(1);
          '

      - name: Revoke ephemeral GitHub runner SSH access
        if: ${{ always() && steps.ci_ssh.outputs.attempted == 'true' && steps.ci_ssh.outputs.source_cidr != '' }}
        working-directory: deploy/cloudru/terraform/ci-ssh-access
        shell: bash
        env:
          TF_VAR_project_id: ${{ secrets.CLOUDRU_PROJECT_ID }}
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_AUTH_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_AUTH_SECRET }}
          TF_VAR_security_group_name: ${{ vars.CLOUDRU_SECURITY_GROUP_NAME || 'coder-survival-backend' }}
          TF_VAR_ssh_port: ${{ vars.CLOUDRU_VM_SSH_PORT || '22' }}
          TF_VAR_github_run_id: ${{ github.run_id }}
          TF_VAR_source_cidr: ${{ steps.ci_ssh.outputs.source_cidr }}
        run: |
          set -euo pipefail
          terraform destroy -auto-approve -input=false -no-color
          echo "Temporary SSH access revoked for GitHub Actions run $GITHUB_RUN_ID"
