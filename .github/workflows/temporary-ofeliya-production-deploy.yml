name: Temporary Ofeliya production deploy bridge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-ofeliya-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_HOST: 176.108.243.20
      TARGET_USER: ubuntu
      RELEASE_SHA: 0c75b6d5ad7710f6db74cdb6d7ed694fda490198
    steps:
      - name: Validate historical SSH secret
        env:
          RECOVERY_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$RECOVERY_KEY" ]] || { echo 'VM_SSH_KEY is missing'; exit 2; }

      - name: Publish runner CIDR handshake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --ipv4 https://checkip.amazonaws.com | tr -d '[:space:]')"
          python3 - "$runner_ip" <<'PY'
          import ipaddress, sys
          ip = ipaddress.ip_address(sys.argv[1])
          assert ip.version == 4 and ip.is_global
          PY
          runner_cidr="${runner_ip}/32"
          encoded="$(printf '%s\n' "$runner_cidr" | base64 -w0)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/.github/recovery-runner-${GITHUB_RUN_ID}.txt" \
            -f message="ops: publish temporary runner CIDR ${GITHUB_RUN_ID}" \
            -f content="$encoded" \
            -f branch="$GITHUB_REF_NAME" >/dev/null
          echo "RUNNER_CIDR=$runner_cidr"

      - name: Configure historical key
        env:
          RECOVERY_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$RECOVERY_KEY" > ~/.ssh/id_recovery
          chmod 600 ~/.ssh/id_recovery

      - name: Wait for temporary network access and verify historical key
        run: |
          set -euo pipefail
          network_ok=false
          for attempt in $(seq 1 90); do
            if nc -z -w 3 "$TARGET_HOST" 22; then
              network_ok=true
              break
            fi
            echo "waiting for SSH network access: attempt $attempt"
            sleep 5
          done
          [[ "$network_ok" == true ]] || { echo 'SSH network access did not open' >&2; exit 3; }
          ssh-keyscan -T 5 -t ed25519 -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_recovery -o BatchMode=yes -o ConnectTimeout=5 "$TARGET_USER@$TARGET_HOST" 'echo HISTORICAL_KEY_OK'

      - name: Fetch immutable Ofeliya deploy script
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/timoshinoleg-eng/ofeliya/${RELEASE_SHA}/deploy/deploy-cloudru.sh" \
            -o /tmp/deploy-cloudru.sh
          test -s /tmp/deploy-cloudru.sh

      - name: Deploy exact Ofeliya main SHA
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_recovery "$TARGET_USER@$TARGET_HOST" \
            "OFELIYA_RELEASE='$RELEASE_SHA' OFELIYA_APP_DIR='/opt/ofeliya' bash -s" \
            < /tmp/deploy-cloudru.sh

      - name: Verify release on host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_recovery "$TARGET_USER@$TARGET_HOST" \
            "set -e; cd /opt/ofeliya; if [ -d .git ]; then git rev-parse HEAD; else cd current; git rev-parse HEAD; fi; docker compose -p ofeliya --env-file /opt/hub/.env --env-file /opt/ofeliya/.env -f deploy/compose.production.yml ps"
