name: Cloud.ru Production Input Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudru-production-input-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production-cloudru
    steps:
      - name: Guard production discovery ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Cloud.ru production discovery is allowed only from main; got $GITHUB_REF" >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Require Cloud.ru read credentials
        shell: bash
        env:
          TF_VAR_project_id: ${{ secrets.CLOUDRU_PROJECT_ID }}
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_AUTH_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_AUTH_SECRET }}
        run: |
          set -euo pipefail
          for key in TF_VAR_project_id TF_VAR_auth_key_id TF_VAR_auth_secret; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required production-cloudru secret for discovery: $key" >&2
              exit 1
            fi
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install pinned Cloud.ru Evolution provider
        run: bash deploy/cloudru/install-terraform-provider-linux-amd64.sh

      - name: Query Cloud.ru catalogs without creating resources
        working-directory: deploy/cloudru/terraform/discovery
        shell: bash
        env:
          TF_VAR_project_id: ${{ secrets.CLOUDRU_PROJECT_ID }}
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_AUTH_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_AUTH_SECRET }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform plan -input=false -lock=false -out=discovery.tfplan
          terraform show -json discovery.tfplan > discovery.json

      - name: Publish sanitized production choices
        working-directory: deploy/cloudru/terraform/discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          def cell(value):
              text = '' if value is None else str(value)
              return text.replace('\\', '\\\\').replace('|', '\\|').replace('\r', ' ').replace('\n', ' ')

          def zones_cell(zones):
              return ', '.join(
                  f"{cell(zone.get('name'))} (`{cell(zone.get('id'))}`)"
                  for zone in (zones or [])
              )

          with open('discovery.json', 'r', encoding='utf-8') as handle:
              plan = json.load(handle)

          outputs = plan.get('planned_values', {}).get('outputs', {})
          zones = outputs.get('enabled_zones', {}).get('value') or []
          flavors = outputs.get('vm_flavors', {}).get('value') or []
          disk_types = outputs.get('disk_types', {}).get('value') or []
          images = outputs.get('ubuntu_2404_images', {}).get('value') or []
          specs = outputs.get('postgres16_specifications', {}).get('value') or []

          zones = sorted(zones, key=lambda item: (not item.get('default', False), item.get('name', '')))
          flavors = sorted(flavors, key=lambda item: (item.get('gpu', 0) != 0, item.get('cpu', 0), item.get('ram_gb', 0), item.get('name', '')))
          disk_types = sorted(disk_types, key=lambda item: (not item.get('free_tier', False), item.get('min_size_gb', 0), item.get('name', '')))
          images = sorted(images, key=lambda item: (item.get('min_ram_gb', 0), item.get('min_cpu', 0), item.get('min_disk_gb', 0), item.get('name', '')))
          specs = sorted(
              specs,
              key=lambda item: (
                  0 if item.get('deployment_mode') == 'standard' else 1,
                  item.get('cpu', 0),
                  item.get('memory_gb', 0),
                  item.get('min_storage_gb', 0),
                  item.get('display_name', ''),
              ),
          )

          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a', encoding='utf-8') as out:
              out.write('## Cloud.ru production input discovery\n\n')
              out.write('Read-only catalog query. No Cloud.ru resources were created or modified. IDs below are the only supported source for production compute selections.\n\n')

              out.write('### Enabled availability zones\n\n')
              if zones:
                  out.write('| Zone ID | Name | Short name | Display name | Default |\n')
                  out.write('|---|---|---|---|---|\n')
                  for zone in zones:
                      out.write(
                          f"| `{cell(zone.get('id'))}` | {cell(zone.get('name'))} | {cell(zone.get('short_name'))} | "
                          f"{cell(zone.get('display_name'))} | {cell(zone.get('default'))} |\n"
                      )
              else:
                  out.write('No enabled availability zones were returned.\n')

              out.write('\n### VM flavors\n\n')
              if flavors:
                  out.write('| Flavor ID | Name | CPU | RAM GB | GPU | Type | Oversubscription | Enabled zones |\n')
                  out.write('|---|---|---:|---:|---:|---|---|---|\n')
                  for flavor in flavors:
                      out.write(
                          f"| `{cell(flavor.get('id'))}` | {cell(flavor.get('name'))} | {cell(flavor.get('cpu'))} | "
                          f"{cell(flavor.get('ram_gb'))} | {cell(flavor.get('gpu'))} | {cell(flavor.get('type'))} | "
                          f"{cell(flavor.get('oversubscription'))} | {zones_cell(flavor.get('zones'))} |\n"
                      )
              else:
                  out.write('No VM flavors with an enabled zone were returned.\n')

              out.write('\n### Disk types\n\n')
              if disk_types:
                  out.write('| Disk type ID | Name | Display name | Free tier | Min GB | Max GB | Enabled zones |\n')
                  out.write('|---|---|---|---|---:|---:|---|\n')
                  for disk_type in disk_types:
                      out.write(
                          f"| `{cell(disk_type.get('id'))}` | {cell(disk_type.get('name'))} | {cell(disk_type.get('display_name'))} | "
                          f"{cell(disk_type.get('free_tier'))} | {cell(disk_type.get('min_size_gb'))} | {cell(disk_type.get('max_size_gb'))} | "
                          f"{zones_cell(disk_type.get('zones'))} |\n"
                      )
              else:
                  out.write('No disk types with an enabled zone were returned.\n')

              out.write('\n### Ubuntu 24.04 images\n\n')
              if images:
                  out.write('| Image ID | Name | Display name | Min CPU | Min RAM GB | Min disk GB | Enabled zones |\n')
                  out.write('|---|---|---|---:|---:|---:|---|\n')
                  for image in images:
                      out.write(
                          f"| `{cell(image.get('id'))}` | {cell(image.get('name'))} | {cell(image.get('display_name'))} | "
                          f"{cell(image.get('min_cpu'))} | {cell(image.get('min_ram_gb'))} | {cell(image.get('min_disk_gb'))} | "
                          f"{zones_cell(image.get('zones'))} |\n"
                      )
              else:
                  out.write('No enabled image whose name/display name contains both `ubuntu` and `24.04` was returned.\n')

              out.write('\n### Managed PostgreSQL 16 specifications\n\n')
              if specs:
                  out.write('| Specification ID | Name | Mode | Flavor | CPU | RAM GB | Min storage GB | Max hosts | HA supported |\n')
                  out.write('|---|---|---|---|---:|---:|---:|---:|---|\n')
                  for spec in specs:
                      out.write(
                          f"| `{cell(spec.get('id'))}` | {cell(spec.get('display_name'))} | {cell(spec.get('deployment_mode'))} | "
                          f"{cell(spec.get('flavor_type'))} | {cell(spec.get('cpu'))} | {cell(spec.get('memory_gb'))} | "
                          f"{cell(spec.get('min_storage_gb'))} | {cell(spec.get('max_hosts'))} | {cell(spec.get('allow_primary_standby'))} |\n"
                      )

                  standard = [spec for spec in specs if spec.get('deployment_mode') == 'standard']
                  if standard:
                      candidate = standard[0]
                      out.write(
                          '\nSmallest returned `standard` specification by CPU/RAM/minimum-storage ordering: '
                          f"`{cell(candidate.get('id'))}` ({cell(candidate.get('display_name'))}). "
                          '**This is not a price comparison or automatic approval.** Verify the current Cloud.ru price before selecting it.\n'
                      )
              else:
                  out.write('No PostgreSQL 16 specifications were returned for this account/project.\n')

              out.write('\n### Selection rule\n\n')
              out.write('Choose `zone_id`, `vm_flavor_id`, `boot_disk_type_id`, `vm_image_id`, and `postgres_specification_id` from these tables. The production Terraform plan rejects zone incompatibility and image minimum CPU/RAM/disk violations.\n')

          missing = [
              name for name, values in (
                  ('enabled_zones', zones),
                  ('vm_flavors', flavors),
                  ('disk_types', disk_types),
                  ('ubuntu_2404_images', images),
                  ('postgres16_specifications', specs),
              ) if not values
          ]
          if missing:
              print(f"Discovery did not return required catalogs: {', '.join(missing)}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Remove local discovery plan and state
        if: ${{ always() }}
        working-directory: deploy/cloudru/terraform/discovery
        shell: bash
        run: rm -f discovery.tfplan discovery.json terraform.tfstate terraform.tfstate.backup
