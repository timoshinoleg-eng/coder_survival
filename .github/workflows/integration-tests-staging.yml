name: Integration Tests (Staging Database)

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/integration-tests-staging.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/integration-tests-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: ${{ secrets.STAGING_TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Require isolated staging database
        run: |
          test -n "$TEST_DATABASE_URL"
          case "$TEST_DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "STAGING_TEST_DATABASE_URL must be a PostgreSQL URL" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Migration bootstrap and idempotency gate
        run: |
          node src/migrate.js
          node src/migrate.js

      - name: Run complete backend suite
        run: npm test -- --runInBand
