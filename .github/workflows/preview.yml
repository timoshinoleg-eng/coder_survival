name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: olegs-projects-bfc4e11a
      VERCEL_PROJECT_ID: prj_6HewqIVhYFQFgim5yQPJjvz6ucHa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        working-directory: frontend
        run: vercel --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Explain skipped preview
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "Vercel preview intentionally skipped because VERCEL_TOKEN is not configured."
