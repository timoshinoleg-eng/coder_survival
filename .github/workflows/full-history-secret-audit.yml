name: Full History Secret Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-history-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          version='3.97.1'
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${version}"
          curl -fsSLO "${base}/trufflehog_${version}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/trufflehog_${version}_checksums.txt"
          grep " trufflehog_${version}_linux_amd64.tar.gz$" "trufflehog_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "trufflehog_${version}_linux_amd64.tar.gz" trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan all reachable Git history without printing secrets
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trufflehog.jsonl"
          err="$RUNNER_TEMP/trufflehog.stderr"

          # JSON output (which can contain raw secret material) is kept only in the
          # ephemeral runner temp directory and is never uploaded or printed.
          set +e
          trufflehog git "file://${GITHUB_WORKSPACE}" --results=verified,unknown --json >"$out" 2>"$err"
          scan_rc=$?
          set -e

          # Emit metadata only: detector, verification status, commit, path, line.
          # Deliberately never print Raw, Redacted, ExtraData, stderr, or full JSON.
          python3 - "$out" "$scan_rc" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          scan_rc = int(sys.argv[2])
          findings = []
          parse_errors = 0

          if path.exists():
              for raw_line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if not raw_line.strip():
                      continue
                  try:
                      obj = json.loads(raw_line)
                  except json.JSONDecodeError:
                      parse_errors += 1
                      continue
                  git = (((obj.get('SourceMetadata') or {}).get('Data') or {}).get('Git') or {})
                  findings.append({
                      'detector': obj.get('DetectorName') or obj.get('DetectorType') or 'unknown',
                      'verified': bool(obj.get('Verified')),
                      'commit': git.get('commit') or 'unknown',
                      'file': git.get('file') or 'unknown',
                      'line': git.get('line') or 'unknown',
                  })

          unique = []
          seen = set()
          for item in findings:
              key = (item['detector'], item['verified'], item['commit'], item['file'], str(item['line']))
              if key not in seen:
                  seen.add(key)
                  unique.append(item)

          verified = sum(1 for x in unique if x['verified'])
          unknown = len(unique) - verified
          print(f"SECRET_AUDIT_SUMMARY verified={verified} unknown={unknown} parse_errors={parse_errors} scanner_rc={scan_rc}")
          for item in unique[:200]:
              status = 'VERIFIED' if item['verified'] else 'UNKNOWN'
              print(
                  'SECRET_AUDIT_FINDING '
                  f"status={status} detector={item['detector']} "
                  f"commit={item['commit']} file={item['file']} line={item['line']}"
              )
          if len(unique) > 200:
              print(f"SECRET_AUDIT_FINDINGS_TRUNCATED total={len(unique)} shown=200")

          if unique or scan_rc != 0 or parse_errors:
              raise SystemExit(1)
          PY
