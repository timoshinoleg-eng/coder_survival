name: Full History Secret Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-history-secret-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan complete reachable Git history without printing secrets
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks.json"

          set +e
          gitleaks git . \
            --log-opts='--all' \
            --report-format=json \
            --report-path="$report" \
            --redact=100 \
            --exit-code=23 \
            --no-banner
          scan_rc=$?
          set -e

          python3 - "$report" "$scan_rc" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          scan_rc = int(sys.argv[2])
          findings = []
          parse_error = False

          if path.exists() and path.stat().st_size:
              try:
                  data = json.loads(path.read_text(encoding='utf-8', errors='strict'))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  data = []
                  parse_error = True
              if isinstance(data, list):
                  for obj in data:
                      findings.append({
                          'rule': obj.get('RuleID') or 'unknown',
                          'commit': obj.get('Commit') or 'unknown',
                          'file': obj.get('File') or 'unknown',
                          'start_line': obj.get('StartLine') or 'unknown',
                          'end_line': obj.get('EndLine') or 'unknown',
                      })
              else:
                  parse_error = True

          unique = []
          seen = set()
          for item in findings:
              key = (item['rule'], item['commit'], item['file'], str(item['start_line']), str(item['end_line']))
              if key not in seen:
                  seen.add(key)
                  unique.append(item)

          print(f"SECRET_AUDIT_SUMMARY findings={len(unique)} parse_error={int(parse_error)} scanner_rc={scan_rc}")
          for item in unique[:300]:
              print(
                  'SECRET_AUDIT_FINDING '
                  f"rule={item['rule']} commit={item['commit']} file={item['file']} "
                  f"lines={item['start_line']}-{item['end_line']}"
              )

          if parse_error or scan_rc not in (0, 23):
              raise SystemExit(2)
          if unique:
              raise SystemExit(1)
          if scan_rc == 23 and not unique:
              raise SystemExit(2)
          PY

      - name: Audit historical secret-file paths across all reachable refs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import subprocess

          # Search every reachable commit for filenames that should never be tracked.
          # Examples/templates are intentionally excluded.
          commits = subprocess.check_output(['git', 'rev-list', '--all'], text=True).splitlines()
          suspicious = {}

          def is_suspicious(path: str) -> bool:
              name = os.path.basename(path).lower()
              p = path.lower()
              if name in {'.env.example', '.env.sample', '.env.template', 'env.example', 'env.sample'}:
                  return False
              if name == '.env' or (name.startswith('.env.') and not name.endswith(('.example', '.sample', '.template'))):
                  return True
              if re.fullmatch(r'(credentials?|secrets?)(\.[a-z0-9_-]+)?\.(json|ya?ml|toml)', name):
                  return True
              if re.fullmatch(r'(service[-_]?account|serviceaccount).*\.json', name):
                  return True
              if name in {'id_rsa', 'id_dsa', 'id_ecdsa', 'id_ed25519'}:
                  return True
              if p.endswith(('.pem', '.p12', '.pfx')) and ('test' not in p and 'fixture' not in p):
                  return True
              return False

          for commit in commits:
              proc = subprocess.run(
                  ['git', 'ls-tree', '-r', '--name-only', commit],
                  text=True, capture_output=True, check=True,
              )
              for path in proc.stdout.splitlines():
                  if is_suspicious(path):
                      suspicious.setdefault(path, commit)

          print(f"SECRET_PATH_AUDIT_SUMMARY commits={len(commits)} paths={len(suspicious)}")
          for path, commit in sorted(suspicious.items()):
              print(f"SECRET_PATH_AUDIT_FINDING commit={commit} file={path}")

          if suspicious:
              raise SystemExit(1)
          PY
