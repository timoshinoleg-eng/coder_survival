name: P0 P1 finalizer

on:
  push:
    branches:
      - fix/p0-p1-audit-requirements
    paths:
      - '.github/workflows/p0p1-finalize-run.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coder_survival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coder_survival_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/coder_survival_test
      NODE_ENV: test
      BOT_TOKEN: 123456789:test_token_for_ci_only
      BOT_BACKEND_SECRET: p0p1-ci-secret
      SESSION_SECRET: p0p1-ci-session
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-p1-audit-requirements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final fail-closed transform
        run: python3 .github/scripts/p0p1_finalize.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run payment race and audit regressions
        working-directory: backend
        run: >-
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js --runInBand
          tests/payments.firstPurchaseBonus.test.js
          tests/p0p1AuditRequirements.test.js
          tests/progression.passiveDecay.test.js
          tests/stage2.oracles.test.js
      - name: Commit verified finalizer
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/config/balance.js backend/src/routes/internalPayments.js backend/tests/payments.firstPurchaseBonus.test.js
          git commit -m 'fix(payments): make concurrent charge replay idempotent'
          git push origin HEAD:fix/p0-p1-audit-requirements
