# LEGACY REFERENCE — not used by the current production release path.
# Production backend deploy now uses docker-compose.backend.yml (backend-only).
# The frontend and bot services below remain only for full-stack local reference.
# Vercel hosts production frontend and bot webhook runtime.

services:
  frontend:
    image: coder-survival-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: coder-survival-backend:local
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_BACKEND_SECRET: ${BOT_BACKEND_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    image: coder-survival-bot:local
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      API_URL: http://backend:3000
      BOT_BACKEND_SECRET: ${BOT_BACKEND_SECRET}
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL is external to this legacy local-reference stack. Configure
  # DB_* and DB_SSL in its environment; no provider host is encoded here.
