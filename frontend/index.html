<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="telegram:bot" content="@coder_survival_bot">
  <title>Coder Survival</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script async src="https://sad.adsgram.ai/js/sad.min.js" onerror="console.warn('[AdsGram] Failed to load, ads disabled')"></script>
  <link rel="stylesheet" href="/src/assets/animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Courier New', monospace;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(110px + env(safe-area-inset-bottom));
    }
    #game-container {
      flex: 0 0 auto;
      position: relative;
      height: clamp(120px, 24dvh, 220px);
      min-height: 120px;
      max-height: 220px;
      overflow: hidden;
    }
    #game-container canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
