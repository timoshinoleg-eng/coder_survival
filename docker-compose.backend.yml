# BACKEND-ONLY PRODUCTION COMPOSE
# Target: Cloud.ru Evolution VM. Frontend and Telegram bot webhook remain on Vercel.
# The backend is bound to loopback; host nginx terminates HTTPS and proxies to :3000.
# Managed PostgreSQL is reached by its private Evolution VPC address.

services:
  backend:
    image: coder-survival-backend:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}
    pull_policy: never
    container_name: coder-survival-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_BACKEND_SECRET: ${BOT_BACKEND_SECRET}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET}
      WEBAPP_URL: ${WEBAPP_URL}
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-3600}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      REWARDED_AD_PROVIDER: ${REWARDED_AD_PROVIDER:-}
      ADSGRAM_SECRET: ${ADSGRAM_SECRET:-}
      PROPELLER_SECRET: ${PROPELLER_SECRET:-}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(async r=>{if(!r.ok)process.exit(1);const h=await r.json();process.exit(h.status==='ok'&&h.db==='connected'?0:1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
