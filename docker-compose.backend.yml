# BACKEND-ONLY PRODUCTION COMPOSE
# This is the active production compose file. It runs only the backend container.
# Frontend and bot production traffic are hosted on Vercel.
# See HANDOFF.md and DEPLOY.md for topology details.
# Production backend compose. The canonical env file is /opt/coder_survival/backend/.env.
# DB_* variables are interpolated from the operator's shell; the backend builds
# its connection string from them. DATABASE_URL is intentionally omitted because
# DB_HOST is set to host.docker.internal in production, and the backend prefers
# DATABASE_URL when present, which would override the intended DB_* strategy.

services:
  backend:
    image: coder-survival-backend:${BACKEND_IMAGE_TAG:-latest}
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_SSL_CA_PATH: ${DB_SSL_CA_PATH:-}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_BACKEND_SECRET: ${BOT_BACKEND_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
